[package]
name = "sentel-contract"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sentel_contract"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
# Not used directly. These are version ceilings: the rustc that ships with the Solana
# platform tools is older than the latest releases of these crates require, so they are
# pinned in [workspace.dependencies] to versions that still build for the SBF target.
# Removing them makes `cargo-build-sbf` fail to resolve.
blake3 = { workspace = true }
constant_time_eq = { workspace = true }
indexmap = { workspace = true }
solana-sha256-hasher = "2.3.0"
solana-security-txt = "1.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
